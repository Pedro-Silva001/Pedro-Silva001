<svg xmlns="http://w3.org" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fundo -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b001a" />
      <stop offset="50%" stop-color="#14012b" />
      <stop offset="100%" stop-color="#25003e" />
    </linearGradient>

    <!-- Gradiente do Monitor -->
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d0636" />
      <stop offset="100%" stop-color="#0f021f" />
    </linearGradient>

    <!-- Efeito Glow (Neon) -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Estilos de Animação CSS Nativos -->
    <style>
      .neon-cyan { stroke: #00f0ff; filter: url(#glow); }
      .neon-magenta { stroke: #ff007f; filter: url(#glow); }
      .fill-cyan { fill: #00f0ff; }
      .fill-magenta { fill: #ff007f; }
      
      /* Animação das Linhas de Código (Matrix/Scanning) */
      @keyframes code-scroll {
        0% { transform: translateY(0px); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(-40px); opacity: 0; }
      }
      .code-line { animation: code-scroll 4s infinite linear; }
      .code-delayed { animation: code-scroll 4s infinite linear; animation-delay: 2s; }

      /* Animação de Pulsação Neon */
      @keyframes pulse {
        0%, 100% { opacity: 0.7; filter: drop-shadow(0 0 2px #ff007f); }
        50% { opacity: 1; filter: url(#glow); }
      }
      .pulse-element { animation: pulse 3s infinite ease-in-out; }

      /* Animação Flutuante do Setup */
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      .floating-setup { animation: float 6s infinite ease-in-out; }

      /* Texto Piscando */
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor-blink { animation: blink 1s infinite; }
    </style>
  </defs>

  <!-- Fundo do Banner -->
  <rect width="800" height="400" fill="url(#bg-gradient)" />
  
  <!-- Detalhes do Grid de Fundo (Estilo Retrowave) -->
  <g opacity="0.05" stroke="#00f0ff" stroke-width="1">
    <path d="M0,300 L800,300 M0,320 L800,320 M0,340 L800,340 M0,360 L800,360 M0,380 L800,380" />
    <path d="M400,300 L0,400 M400,300 L150,400 M400,300 L300,400 M400,300 L450,400 M400,300 L600,400 M400,300 L800,400" />
  </g>

  <!-- Grupo Principal do Setup Flutuante -->
  <g class="floating-setup" transform="translate(0, 0)">
    
    <!-- LED Traseiro da Mesa (Glow de Fundo) -->
    <ellipse cx="400" cy="190" rx="260" ry="100" fill="#ff007f" opacity="0.15" filter="url(#glow)" />
    <ellipse cx="400" cy="190" rx="180" ry="60" fill="#00f0ff" opacity="0.15" filter="url(#glow)" />

    <!-- Suporte do Monitor -->
    <path d="M370,260 L430,260 L440,290 L360,290 Z" fill="#1a0c2e" stroke="#ff007f" stroke-width="1.5" opacity="0.8" />
    <rect x="350" y="290" width="100" height="10" rx="3" fill="#0d041a" stroke="#00f0ff" stroke-width="1" />

    <!-- Moldura do Monitor Principal -->
    <rect x="180" y="60" width="440" height="210" rx="12" fill="#090115" stroke="url(#bg-gradient)" stroke-width="4" filter="url(#soft-glow)" />
    <!-- Tela Interna -->
    <rect x="190" y="70" width="420" height="190" rx="6" fill="url(#screen-grad)" stroke="#ff007f" stroke-width="1" class="pulse-element" />

    <!-- Conteúdo da Tela: IDE / Código Pixelado -->
    <g transform="translate(210, 90)">
      <!-- Janela de Código de Canto -->
      <rect x="0" y="0" width="160" height="150" rx="4" fill="#080010" opacity="0.8" stroke="#00f0ff" stroke-width="0.5" />
      <circle cx="10" cy="10" r="3" fill="#ff5f56" />
      <circle cx="20" cy="10" r="3" fill="#ffbd2e" />
      <circle cx="30" cy="10" r="3" fill="#27c93f" />
      
      <!-- Linhas de Código Animadas (Grupo 1) -->
      <g class="code-line" transform="translate(10, 30)">
        <rect x="0" y="5" width="40" height="6" rx="2" fill="#ff007f" />
        <rect x="45" y="5" width="60" height="6" rx="2" fill="#00f0ff" />
        <rect x="0" y="18" width="80" height="6" rx="2" fill="#fff" opacity="0.7" />
        <rect x="0" y="31" width="30" height="6" rx="2" fill="#00f0ff" />
        <rect x="35" y="31" width="45" height="6" rx="2" fill="#ffbd2e" />
        <rect x="0" y="44" width="90" height="6" rx="2" fill="#27c93f" />
      </g>
      
      <!-- Linhas de Código Animadas (Grupo 2 com delay) -->
      <g class="code-delayed" transform="translate(10, 70)">
        <rect x="0" y="5" width="50" height="6" rx="2" fill="#00f0ff" />
        <rect x="55" y="5" width="35" height="6" rx="2" fill="#ff007f" />
        <rect x="0" y="18" width="65" height="6" rx="2" fill="#27c93f" />
        <rect x="0" y="31" width="40" height="6" rx="2" fill="#fff" opacity="0.7" />
      </g>

      <!-- Gráfico Central ("Pixel Art Preview") -->
      <rect x="180" y="0" width="220" height="150" rx="4" fill="#080010" opacity="0.8" stroke="#ff007f" stroke-width="0.5" />
      
      <!-- Detalhes do Grid de Design -->
      <g opacity="0.2" stroke="#00f0ff" stroke-width="0.5">
        <line x1="180" y1="50" x2="400" y2="50" />
        <line x1="180" y1="100" x2="400" y2="100" />
        <line x1="250" y1="0" x2="250" y2="150" />
        <line x1="330" y1="0" x2="330" y2="150" />
      </g>

      <!-- Texto Central Estilizado -->
      <text x="290" y="75" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#00f0ff" text-anchor="middle" letter-spacing="2" filter="url(#soft-glow)">
        PIXEL_SETUP
      </text>
      <text x="290" y="95" font-family="'Courier New', monospace" font-size="11" fill="#ff007f" text-anchor="middle" opacity="0.8">
        > INITIALIZING<tspan class="cursor-blink">_</tspan>
      </text>
    </g>

    <!-- Teclado Mecânico Compacto -->
    <rect x="310" y="305" width="180" height="12" rx="3" fill="#0d041a" stroke="#ff007f" stroke-width="1" />
    <!-- Detalhe do LED do Teclado -->
    <line x1="315" y1="311" x2="485" y2="311" stroke="#00f0ff" stroke-width="2" opacity="0.6" filter="url(#soft-glow)" />

    <!-- Mouse Gamer com fita de LED -->
    <rect x="510" y="307" width="16" height="10" rx="4" fill="#0d041a" stroke="#00f0ff" stroke-width="1" />
    <circle cx="518" cy="307" r="1.5" fill="#ff007f" />
    
    <!-- Caixas de Som Laterais (Esquerda e Direita) -->
    <!-- Caixa Esquerda -->
    <rect x="130" y="140" width="30" height="90" rx="4" fill="#090115" stroke="#00f0ff" stroke-width="1" />
    <circle cx="145" cy="165" r="10" fill="#120224" stroke="#ff007f" stroke-width="1.5" class="pulse-element" />
    <circle cx="145" cy="205" r="7" fill="#120224" stroke="#00f0ff" stroke-width="1" />

    <!-- Caixa Direita -->
    <rect x="640" y="140" width="30" height="90" rx="4" fill="#090115" stroke="#00f0ff" stroke-width="1" />
    <circle cx="655" cy="165" r="10" fill="#120224" stroke="#ff007f" stroke-width="1.5" class="pulse-element" />
    <circle cx="655" cy="205" r="7" fill="#120224" stroke="#00f0ff" stroke-width="1" />
  </g>

  <!-- Elementos de Decoração Flutuantes Extra (Partículas de Pixel) -->
  <g fill="#00f0ff" opacity="0.4">
    <rect x="100" y="80" width="6" height="6" class="pulse-element" />
    <rect x="700" y="120" width="8" height="8" style="animation: pulse 2s infinite ease-in-out;" />
    <rect x="150" y="280" width="5" height="5" class="pulse-element" />
    <rect x="660" y="70" width="6" height="6" />
  </g>
  <g fill="#ff007f" opacity="0.4">
    <rect x="720" y="240" width="6" height="6" class="pulse-element" />
    <rect x="80" y="190" width="7" height="7" />
    <rect x="620" y="300" width="5" height="5" class="pulse-element" />
  </g>
</svg>
